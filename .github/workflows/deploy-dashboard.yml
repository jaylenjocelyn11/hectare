# À chaque envoi sur la branche main, GitHub fabrique le site et le publie (GitHub Pages).
name: Publier le tableau de bord

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer et construire
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: hectarecafe-e0df2.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: hectarecafe-e0df2
          VITE_FIREBASE_STORAGE_BUCKET: hectarecafe-e0df2.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "523047663076"
          VITE_FIRESTORE_DATABASE_ID: hectarecafe
          VITE_PLATFORM_ADMIN_EMAIL: ${{ secrets.VITE_PLATFORM_ADMIN_EMAIL }}
        run: |
          npm install
          npm run build
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
